        <i class="fa-solid fa-circle-check"></i>

    <!-- Core App Logic -->
    <script>
        let appState = {
            apiKey: '',
            threads: [],
            activeThreadId: null,
            attachedMedia: []
        };

        let promptInput, promptCharCount, chatMessages, threadList, sandboxEditor;

        window.addEventListener('DOMContentLoaded', () => {
            promptInput = document.getElementById('prompt-input');
            promptCharCount = document.getElementById('prompt-char-count');
            chatMessages = document.getElementById('chat-messages');
            threadList = document.getElementById('thread-list');
            sandboxEditor = document.getElementById('sandbox-editor');

            if (promptInput) {
                promptInput.addEventListener('input', (e) => {
                    promptCharCount.innerText = `${e.target.value.length} 文字`;
                });

                promptInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleGenerate(e);
                    }
                });
            }

            // Global paste support for images
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        const file = item.getAsFile();
                        processImageFile(file);
                    }
                }
            });

            loadApiKeyFromStorage();
            loadThreadsFromStorage();

            if (appState.threads.length === 0) {
                createNewThread();
            } else {
                switchThread(appState.threads[0].id);
            }
        });

        // Key Storage
        function loadApiKeyFromStorage() {
            const key = localStorage.getItem('codecraft_api_key');
            if (key) {
                appState.apiKey = key;
                document.getElementById('api-key-btn-text').innerText = "Key 設定済";
                document.getElementById('api-status-badge').innerText = "Gemini Connected";
                document.getElementById('api-status-badge').className = "font-mono text-emerald-400 font-medium";
            } else {
                document.getElementById('api-key-btn-text').innerText = "API Key";
                document.getElementById('api-status-badge').innerText = "Demo Mode";
                document.getElementById('api-status-badge').className = "font-mono text-slate-500";
            }
        }

        function openApiKeyModal() {
            document.getElementById('api-key-modal').classList.remove('hidden');
            document.getElementById('api-key-input').value = appState.apiKey || '';
        }

        function closeApiKeyModal() {
            document.getElementById('api-key-modal').classList.add('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            appState.apiKey = key;
            if (key) {
                localStorage.setItem('codecraft_api_key', key);
            } else {
                localStorage.removeItem('codecraft_api_key');
            }
            closeApiKeyModal();
            loadApiKeyFromStorage();
            showToast(key ? "APIキーを保存しました" : "デモモードに切り替えました");
        }

        // Thread Operations
        function createNewThread() {
            const newId = 'thread_' + Date.now();
            const newThread = {
                id: newId,
                title: '新しい会話',
                createdAt: new Date().toISOString(),
                messages: []
            };
            appState.threads.unshift(newThread);
            appState.activeThreadId = newId;
            saveThreadsToStorage();
            renderThreads();
            renderActiveThreadMessages();
        }

        function switchThread(threadId) {
            appState.activeThreadId = threadId;
            renderThreads();
            renderActiveThreadMessages();
        }

        function deleteThread(threadId, e) {
            if (e) e.stopPropagation();
            appState.threads = appState.threads.filter(t => t.id !== threadId);
            if (appState.threads.length === 0) {
                createNewThread();
            } else {
                if (appState.activeThreadId === threadId) {
                    appState.activeThreadId = appState.threads[0].id;
                }
                saveThreadsToStorage();
                renderThreads();
                renderActiveThreadMessages();
            }
            showToast("スレッドを削除しました");
        }

        function editThreadTitle(threadId, e) {
            if (e) e.stopPropagation();
            const thread = appState.threads.find(t => t.id === threadId);
            if (!thread) return;
            const newTitle = prompt("チャット名を入力してください:", thread.title);
            if (newTitle && newTitle.trim()) {
                thread.title = newTitle.trim();
                saveThreadsToStorage();
                renderThreads();
            }
        }

        function renderThreads() {
            if (!threadList) return;
            threadList.innerHTML = '';
            document.getElementById('thread-count').innerText = appState.threads.length;

            appState.threads.forEach(t => {
                const isActive = t.id === appState.activeThreadId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs transition ${
                    isActive ? 'bg-indigo-600/20 text-white border border-indigo-500/40 font-medium' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                }`;
                div.onclick = () => switchThread(t.id);

                div.innerHTML = `
                    <div class="flex items-center gap-2 truncate pr-2">
                        <i class="fa-solid fa-message ${isActive ? 'text-indigo-400' : 'text-slate-500'} text-[11px]"></i>
                        <span class="truncate">${escapeHTML(t.title)}</span>
                    </div>

        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files) return;
            for (let f of files) {
                if (f.type.startsWith('image/')) {
                    processImageFile(f);
                } else if (f.type.startsWith('video/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        appState.attachedMedia.push({ type: 'video', data: ev.target.result, name: f.name });
                        renderMediaPreviews();
                    };
                    reader.readAsDataURL(f);
                } else {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        appState.attachedMedia.push({ type: 'file', data: ev.target.result, name: f.name });
                        renderMediaPreviews();
                    };
                    reader.readAsText(f);
                }
            }
        }

        function processImageFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                appState.attachedMedia.push({ type: 'image', data: event.target.result, mimeType: file.type });
                renderMediaPreviews();
                showToast("画像を添付しました");
            };
            reader.readAsDataURL(file);
        }

        function removeMedia(index) {
            appState.attachedMedia.splice(index, 1);
            renderMediaPreviews();
        }

        function renderMediaPreviews() {
            const container = document.getElementById('media-preview-bar');
            if (!container) return;
            if (appState.attachedMedia.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            container.innerHTML = '';

            appState.attachedMedia.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = "relative group shrink-0 rounded-lg overflow-hidden border border-slate-700 w-16 h-16 bg-slate-900 flex items-center justify-center";

                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                } else if (m.type === 'video') {
                    div.innerHTML = `
                        <i class="fa-solid fa-video text-indigo-400 text-lg"></i>
                        <button type="button" onclick="removeMedia(${idx})" class="absolute top-0 right-0 bg-slate-950/80 text-red-400 p-1 text-[10px] hover:bg-red-600 hover:text-white transition">
                            <i class="fa-solid fa-xmark"></i>

                        <div class="text-[9px] p-1 text-indigo-300 truncate font-mono text-center">${escapeHTML(m.name || 'file')}</div>
                        <button type="button" onclick="removeMedia(${idx})" class="absolute top-0 right-0 bg-slate-950/80 text-red-400 p-1 text-[10px] hover:bg-red-600 hover:text-white transition">

        function clearCurrentChat() {

        // Full Multi-turn Gemini AI Handling
        async function handleGenerate(event) {
            if (event) event.preventDefault();
            const userPrompt = promptInput.value.trim();
            if (!userPrompt && appState.attachedMedia.length === 0) return;

            const activeThread = getActiveThread();
            if (!activeThread) return;

            if (activeThread.messages.length === 0 && userPrompt) {
                activeThread.title = userPrompt.length > 20 ? userPrompt.substring(0, 20) + '...' : userPrompt;
                renderThreads();
            }

            document.getElementById('welcome-banner')?.classList.add('hidden');

            const mediaCopy = [...appState.attachedMedia];
            appendUserMessageUI(userPrompt, mediaCopy);
            
            // Push user message into conversation thread history
            activeThread.messages.push({ role: 'user', text: userPrompt, media: mediaCopy });

            promptInput.value = '';
            promptCharCount.innerText = '0 文字';
            appState.attachedMedia = [];
            renderMediaPreviews();

            const loadingId = appendLoadingIndicator();
            scrollToBottom();

            const isImageGenRequest = userPrompt.includes('画像生成') || userPrompt.includes('イラスト描いて') || userPrompt.includes('画像を生成して');

            try {
                if (isImageGenRequest && appState.apiKey) {
                    await fetchGeminiImageGen(userPrompt, loadingId);
                } else {
                    await fetchGeminiTextResponse(userPrompt, loadingId);
                }
            } catch (err) {
                removeLoadingIndicator(loadingId);
                generateMockResponse(userPrompt, isImageGenRequest);
            }

            saveThreadsToStorage();
        }

        async function fetchGeminiTextResponse(userPrompt, loadingId) {
            let apiKey = appState.apiKey ? appState.apiKey.trim() : '';
            // Try newest models first
            const models = ['gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-1.5-flash'];
            const activeThread = getActiveThread();

            const systemInstructionText = `あなたはGoogle Geminiのように賢くフレンドリーな万能AI「CodeCraft AI」です。

【会話ルール】
1. 前後の文脈・過去の発言（作成したコードや質問）を完全に踏まえて応答してください。
2. 「さっきの直して」「これどう思う？」といった指示にも直前の文脈から理解して回答してください。
3. 雑談・計算・一般的な質問にはわかりやすいテキストで自然に答えてください。
4. コード作成や修正が必要なときのみ、適切な解説と共にマークダウンのコードブロックで提供してください。`;

            // Build full conversation contents payload for multi-turn context
            const contents = [];
            if (activeThread && activeThread.messages.length > 0) {
                activeThread.messages.forEach(msg => {
                    const role = msg.role === 'user' ? 'user' : 'model';
                    const parts = [];

                    if (msg.text) {
                        parts.push({ text: msg.text });
                    }

                    if (msg.media && msg.media.length > 0) {
                        msg.media.forEach(m => {
                            if (m.type === 'image' && m.data) {
                                const base64Clean = m.data.includes(',') ? m.data.split(',')[1] : m.data;
                                parts.push({
                                    inlineData: {
                                        mimeType: m.mimeType || 'image/png',
                                        data: base64Clean
                                    }
                                });
                            }
                        });
                    }

                    if (parts.length > 0) {
                        contents.push({ role, parts });
                    }
                });
            } else {
                contents.push({ role: 'user', parts: [{ text: userPrompt }] });
            }

            const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: systemInstructionText }] }
            };

            let success = false;
            let aiText = "";

            if (apiKey) {
                for (const model of models) {
                    try {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                                aiText = data.candidates[0].content.parts[0].text;
                                success = true;
                                break;
                            }
                        }
                    } catch (e) {
                        console.warn(`Model ${model} request error:`, e);
                    }
                }
            }

            removeLoadingIndicator(loadingId);

            if (success && aiText) {
                activeThread.messages.push({ role: 'ai', text: aiText });
                renderAIFormattedMessage(aiText, true);
            } else {
                generateMockResponse(userPrompt, false);
            }
        }

        async function fetchGeminiImageGen(userPrompt, loadingId) {
            const apiKey = appState.apiKey;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
            const activeThread = getActiveThread();

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            removeLoadingIndicator(loadingId);

            const candidate = data.candidates?.[0];
            const imgPart = candidate?.content?.parts?.find(p => p.inlineData);
            const textPart = candidate?.content?.parts?.find(p => p.text);

            let textOutput = textPart ? textPart.text : "ご指定の画像を生成しました！";

            if (imgPart && imgPart.inlineData) {
                const mime = imgPart.inlineData.mimeType || "image/png";
                const base64Img = `data:${mime};base64,${imgPart.inlineData.data}`;
                activeThread.messages.push({ role: 'ai', text: `${textOutput}\n\n![Generated Image](${base64Img})` });
                renderAIFormattedMessage(`${textOutput}\n\n![Generated Image](${base64Img})`, true);
            } else {
                activeThread.messages.push({ role: 'ai', text: textOutput });
                renderAIFormattedMessage(textOutput, true);
            }
        }

        function generateMockResponse(promptText, isImageGen) {
            const activeThread = getActiveThread();
            let aiText = "";

            if (isImageGen) {
                const sampleSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%231e1b4b"/><circle cx="200" cy="150" r="80" fill="%236366f1"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">AI Preview</text></svg>`;
                aiText = `「${promptText}」のサンプル画像を生成しました！\nAPIキーを設定するとGemini 3.1 Flash Imageで本格的な画像が生成できます。\n\n![Generated Image](${sampleSvg})`;
            } else if (promptText.includes('1+1') || promptText.includes('1 + 1')) {
                aiText = "1 + 1 は 2 です！他に気になる計算や質問があれば何でも言ってくださいね。";
            } else if (promptText.includes('直して') || promptText.includes('修正')) {
                aiText = `直前の会話の内容を踏まえて修正しました！\n\n\`\`\`javascript\n// 修正後のコード\nfunction updateUI() {\n    console.log("さっきの文脈を踏まえて修正を適用しました！");\n}\n\`\`\`\n\n他に変更したい部分があれば気軽に教えてください。`;
            } else if (promptText.includes('コード') || promptText.includes('作って')) {
                aiText = `「${promptText}」に対応するコードを作成しました！\n\n\`\`\`html\n<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { background: #0f172a; color: white; display: flex; justify-content: center; font-family: sans-serif; padding: 40px; }\n    .btn { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <button class="btn" onclick="alert('クリックされました！')">サンプルボタン</button>\n</body>\n</html>\n\`\`\`\n\n「Playgroundで開く」を押すとプレビュー表示できます！`;
            } else {
                aiText = `「${promptText}」ですね！日常会話からプログラミング、画像の生成まで文脈に合わせてお答えします。`;
            }

            activeThread.messages.push({ role: 'ai', text: aiText });
            renderAIFormattedMessage(aiText, true);
        }

        // Render Helpers
        function appendUserMessageUI(text, media = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex items-start justify-end gap-3 max-w-4xl mx-auto my-4";

            let mediaHTML = "";
            if (media && media.length > 0) {
                mediaHTML += `<div class="flex flex-wrap gap-2 mb-2">`;
                media.forEach(m => {
                    if (m.type === 'image') {
                        mediaHTML += `<img src="${m.data}" class="max-w-xs max-h-48 rounded-lg border border-slate-700 object-cover">`;
                    } else if (m.type === 'video') {
                        mediaHTML += `<video src="${m.data}" controls class="max-w-xs max-h-48 rounded-lg border border-slate-700"></video>`;
                    } else {
                        mediaHTML += `<div class="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-mono text-indigo-300 border border-slate-700 flex items-center gap-1.5"><i class="fa-solid fa-file text-xs"></i> ${escapeHTML(m.name || 'File')}</div>`;
                    }
                });
                mediaHTML += `</div>`;
            }

            msgDiv.innerHTML = `
                <div class="bg-indigo-600/90 border border-indigo-500/40 text-white p-4 rounded-2xl rounded-tr-none max-w-2xl shadow-md text-sm leading-relaxed">
                    ${mediaHTML}
                    <div class="whitespace-pre-wrap">${escapeHTML(text)}</div>
                </div>
            `;
            chatMessages.appendChild(msgDiv);
        }

        function renderAIFormattedMessage(text, animate = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex items-start gap-3 max-w-4xl mx-auto my-4";

            const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
            let formattedHTML = "";
            let lastIndex = 0;
            let match;

            while ((match = codeBlockRegex.exec(text)) !== null) {
                const textBefore = text.substring(lastIndex, match.index);
                if (textBefore) {
                    formattedHTML += `<div class="whitespace-pre-wrap mb-3 leading-relaxed">${formatMarkdownText(textBefore)}</div>`;
                }

                const lang = match[1] || 'javascript';
                const code = match[2];
                const codeId = 'code_' + Math.random().toString(36).substring(2, 9);
                const prismClass = getPrismClass(lang);

                formattedHTML += `
                    <div class="my-4 rounded-xl overflow-hidden border border-slate-800 bg-[#0d1117] shadow-xl">
                        <div class="bg-slate-900/90 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
                            <span class="font-mono font-medium text-indigo-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-code text-[11px]"></i> ${escapeHTML(lang.toUpperCase())}
                            </span>
                            <div class="flex items-center gap-2">
                                <button onclick="sendToSandbox('${codeId}')" class="px-2.5 py-1 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 rounded-lg font-medium transition flex items-center gap-1 cursor-pointer">
                                    <i class="fa-solid fa-play text-[10px]"></i> Playgroundで開く
                                </button>
                                <button onclick="copyCodeToClipboard('${codeId}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium transition flex items-center gap-1 cursor-pointer">
                                    <i class="fa-solid fa-copy text-[10px]"></i> コピー
                                </button>
                            </div>
                        </div>
                        <div class="p-4 overflow-x-auto code-font text-xs leading-relaxed">
                            <pre class="!bg-transparent !m-0 !p-0"><code id="${codeId}" class="language-${prismClass}">${escapeHTML(code)}</code></pre>
                        </div>
                    </div>
                `;

                lastIndex = codeBlockRegex.lastIndex;
            }

            const remainingText = text.substring(lastIndex);
            if (remainingText) {
                formattedHTML += `<div class="whitespace-pre-wrap leading-relaxed">${formatMarkdownText(remainingText)}</div>`;
            }

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-slate-900 border border-slate-800 text-slate-100 p-4 rounded-2xl rounded-tl-none max-w-3xl shadow-md text-sm leading-relaxed w-full">
                    ${formattedHTML}
                </div>
            `;

            chatMessages.appendChild(msgDiv);
            Prism.highlightAllUnder(msgDiv);
            scrollToBottom();
        }

        function formatMarkdownText(text) {
            let escaped = escapeHTML(text);

            escaped = escaped.replace(/!\[(.*?)\]\((.*?)\)/g, (m, alt, url) => {
                return `
                    <div class="my-3 relative group max-w-md rounded-2xl overflow-hidden border border-slate-700 shadow-xl bg-slate-950">
                        <img src="${url}" class="w-full h-auto object-cover" alt="${alt}">
                        <div class="p-2 bg-slate-900 border-t border-slate-800 flex justify-end">
                            <a href="${url}" download="ai-generated-image.png" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-download"></i> ダウンロード
                            </a>
                        </div>
                    </div>
                `;
            });

            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
            escaped = escaped.replace(/`([^`]+)`/g, '<code class="bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded font-mono text-xs">$1</code>');
            return escaped;
        }

        function appendLoadingIndicator() {
            const id = 'loading_' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = "flex items-center gap-3 max-w-4xl mx-auto my-4";
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">
                    <i class="fa-solid fa-robot animate-spin"></i>
                </div>
                <div class="bg-slate-900 border border-slate-800 text-slate-400 p-4 rounded-2xl rounded-tl-none shadow-md flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                    <span class="text-xs ml-2">回答中...</span>
                </div>
            `;
            chatMessages.appendChild(msgDiv);
            return id;

        function removeLoadingIndicator(id) {

        // Sandbox Methods
        function sendToSandbox(codeId) {
            const codeEl = document.getElementById(codeId);
            if (!codeEl || !sandboxEditor) return;
            sandboxEditor.value = codeEl.innerText;
            switchView('sandbox');
            runSandboxCode();
            showToast("Playgroundへ送りました");
        }

        function copyCodeToClipboard(codeId) {
            const codeEl = document.getElementById(codeId);
            if (!codeEl) return;
            const text = codeEl.innerText;
            const area = document.createElement('textarea');
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            showToast("コードをコピーしました");
        }

        function runSandboxCode() {
            const code = sandboxEditor.value;
            const iframe = document.getElementById('sandbox-iframe');
            if (iframe) {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            }
        }

        function resetSandbox() {
            if (sandboxEditor) sandboxEditor.value = '';
            runSandboxCode();
            showToast("Playgroundをリセットしました");
        }

        function saveThreadsToStorage() {
            try {
                localStorage.setItem('codecraft_threads', JSON.stringify(appState.threads));
            } catch (e) {}
        }

        function loadThreadsFromStorage() {
            try {
                const saved = localStorage.getItem('codecraft_threads');
                if (saved) appState.threads = JSON.parse(saved);
            } catch (e) {
                appState.threads = [];
            }
        }

        function scrollToBottom() {
            if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function getPrismClass(lang) {
            const map = { 'js': 'javascript', 'html': 'markup', 'css': 'css', 'python': 'python', 'py': 'python', 'cpp': 'cpp', 'c++': 'cpp', 'sql': 'sql', 'jsx': 'jsx' };
            return map[lang.toLowerCase()] || 'javascript';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            if (!toast || !toastMsg) return;
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
